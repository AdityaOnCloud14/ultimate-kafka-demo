  spring:
    application:
      name: delete-account-services
    datasource:
      url: jdbc:postgresql://<rds-endpoint>:5432/delete_account_db
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
    jpa:
      hibernate:
        ddl-auto: update

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: delete-account-group
      auto-offset-reset: earliest

  management:
    endpoints:
      web:
        exposure:
          include: health,info,prometheus
    metrics:
      export:
        prometheus:
          enabled: true
